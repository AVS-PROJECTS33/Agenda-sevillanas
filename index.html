<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Dani Candela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/agenda.css">
    <!-- Librerías para exportar a PDF y Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="admin-body">
    <nav class="sidebar">
        <h2>Agenda de Sevillanas</h2>
        <ul id="date-links">
            <!-- Links generated by JS -->
        </ul>
    </nav>
    <main class="dashboard">
        <header class="dashboard-header">
            <div class="header-main">
                <h1 id="current-date-title">Selecciona una fecha</h1>
                <div class="stats">
                    <span>Total apuntados: <strong id="total-count">0</strong></span>
                </div>
            </div>
            <div class="export-actions">
                <button id="btn-export-pdf" class="btn-action btn-pdf">📄 Descargar PDF</button>
                <button id="btn-export-excel" class="btn-action btn-excel">📊 Descargar Excel</button>
            </div>
        </header>
        <section class="table-container glass-panel">
            <table id="attendees-table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="attendees-body">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
            <div id="empty-message" class="hidden">No hay nadie apuntado para este día todavía.</div>
        </section>
    </main>
    <script src="js/agenda.js"></script>
</body>
</html>
